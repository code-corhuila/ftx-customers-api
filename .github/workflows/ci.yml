# Build, tests (unit, web, integration against the real ftx-customers-db migrations), secret scan
# over the whole history and the container image, on every Pull Request.
name: ci

on:
  pull_request:
    branches: [develop, qa, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # The integration tests run the real migrations of the customers schema (Testcontainers).
      - uses: actions/checkout@v4
        with:
          repository: code-corhuila/ftx-customers-db
          ref: develop
          path: ftx-customers-db

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Unit, web and integration tests
        run: mvn -B verify -Dcustomers.db.dir="$GITHUB_WORKSPACE/ftx-customers-db"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks over code, docs and the whole commit history
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 git /repo --redact --verbose --exit-code 1

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the container image
        run: docker build -t ftx-customers-api:ci .
