# ftx-customers-api. Every value that changes per environment comes from an environment variable.
server:
  port: ${PORT:8081}
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: ftx-customers-api
  datasource:
    # customers_app is created by ftx-infra-postgres and receives customers_writer from ftx-customers-db.
    url: ${CUSTOMERS_DB_URL:jdbc:postgresql://postgres:5432/ftx}
    username: ${CUSTOMERS_DB_USER:customers_app}
    # No default on purpose: without a password the service does not start.
    password: ${CUSTOMERS_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${CUSTOMERS_DB_POOL_SIZE:5}
  flyway:
    enabled: false                       # the schema belongs to ftx-customers-db; this API never migrates
  jackson:
    deserialization:
      fail-on-unknown-properties: true   # unknown fields are a 400, not silently ignored
  mvc:
    problemdetails:
      enabled: false                     # errors use ErrorResponse of _shared.yaml

customers:
  jwt:
    # RSA private key, PKCS#8 PEM, at least 2048 bits. Never versioned. No default on purpose.
    private-key: ${CUSTOMERS_JWT_PRIVATE_KEY:}
    key-id: ${CUSTOMERS_JWT_KEY_ID:}
    issuer: ${CUSTOMERS_JWT_ISSUER:ftx-customers-api}
    # Only for local development: a new key on every start. Ignored when private-key is set.
    ephemeral: ${CUSTOMERS_JWT_EPHEMERAL:false}
  security:
    bcrypt-strength: ${CUSTOMERS_BCRYPT_STRENGTH:12}
    login-attempts-per-address: 10      # security-rules.md A07
    login-window: 5m
    max-consecutive-failures: 5
    lock-duration: 15m
  bootstrap:
    # First administrator (all three or none). A BCrypt hash, never the password itself.
    name: ${CUSTOMERS_BOOTSTRAP_ADMIN_NAME:}
    email: ${CUSTOMERS_BOOTSTRAP_ADMIN_EMAIL:}
    password-hash: ${CUSTOMERS_BOOTSTRAP_ADMIN_PASSWORD_HASH:}

management:
  endpoints:
    web:
      base-path: /                       # GET /health/liveness and /health/readiness for the container
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  structured:
    format:
      console: ecs                       # JSON lines with correlationId and the security event fields
